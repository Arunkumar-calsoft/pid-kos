<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KOS-PID Visual Query</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Courier New',monospace;background:#0a0d14;color:#e2e8f0}
:root{
  --a:#d97706;--al:#fbbf24;--bg:#0a0d14;--sf:#0f1520;--bd:#1e2d42;
  --tx:#e2e8f0;--mu:#4a6080;--dm:#111827;--re:#ef4444;--gr:#22c55e;
  /* Phase 3.5 violation severity palette */
  --sev-c:#ef4444;--sev-c-bg:#ef444418;--sev-c-bd:#ef444440;
  --sev-h:#f59e0b;--sev-h-bg:#f59e0b18;--sev-h-bd:#f59e0b40;
  --sev-m:#eab308;--sev-m-bg:#eab30818;--sev-m-bd:#eab30840;
}
.root{display:grid;grid-template-columns:1fr 400px;height:100vh;overflow:hidden}
.viewer{display:flex;flex-direction:column;background:#060912;overflow:hidden}
.vhead{padding:7px 14px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.pid-sel{background:transparent;border:1px solid var(--a);color:var(--a);font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:2px;cursor:pointer;font-family:'Courier New',monospace;outline:none;appearance:none}
.pid-sel option{background:#111827;color:#e2e8f0}
.vtitle{font-size:10px;color:var(--mu);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cdot.live{background:var(--gr);animation:bl 2s infinite}
.cdot.off{background:var(--mu)}
.cdot.err{background:var(--re)}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Image / overlay ─────────────────────────────────────────────────────── */
.imgwrap{flex:1;overflow:auto;position:relative;min-height:0;background:#050810;cursor:crosshair}
#imgbox{position:relative;display:inline-block;line-height:0}
.pid-img{display:block;max-width:100%;width:100%;height:auto;opacity:.92;transition:opacity .3s;user-select:none}
.pid-img.loading{opacity:.3}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:all}
.hbox{cursor:pointer;transition:fill-opacity .15s,stroke-width .15s}
.hbox:hover{fill-opacity:.45 !important;stroke-width:2.5 !important}
.hbox.selected{stroke-width:3 !important;fill-opacity:.5 !important}

/* Tooltip */
#tooltip{position:fixed;z-index:1000;background:#0d1929;border:1px solid var(--a);border-radius:4px;padding:8px 10px;font-size:10px;color:var(--tx);pointer-events:none;max-width:360px;opacity:0;transition:opacity .12s;line-height:1.6}
#tooltip.show{opacity:1}
#tooltip .tt-id{color:var(--al);font-weight:bold;font-size:11px;margin-bottom:3px}
#tooltip .tt-reason{color:var(--tx);margin-bottom:4px;white-space:pre-wrap;word-break:break-word}
#tooltip .tt-key{color:var(--mu)}
#tooltip .tt-val{color:#a5b4fc}
.tt-expl{color:#94a3b8;font-size:9px;line-height:1.5;margin-top:4px;padding-top:4px;border-top:1px solid #1e2d42;white-space:pre-wrap;word-break:break-word}
.tt-sev{display:inline-block;font-size:9px;padding:1px 6px;border-radius:2px;margin-bottom:5px;font-weight:bold;letter-spacing:.05em}
.tt-sev.CRITICAL{background:var(--sev-c-bg);color:var(--sev-c);border:1px solid var(--sev-c-bd)}
.tt-sev.HIGH    {background:var(--sev-h-bg);color:var(--sev-h);border:1px solid var(--sev-h-bd)}
.tt-sev.MEDIUM  {background:var(--sev-m-bg);color:var(--sev-m);border:1px solid var(--sev-m-bd)}
.hbox.context{opacity:.55;stroke-dasharray:4,3 !important;stroke-width:1.2 !important}
.hbox.context:hover{opacity:.8}

.vfoot{padding:5px 14px;background:var(--sf);border-top:1px solid var(--bd);min-height:28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;font-size:10px}
.ldot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Panel */
.panel{display:flex;flex-direction:column;border-left:1px solid var(--bd);background:var(--sf);min-height:0}
.phead{padding:9px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.ptitle{font-size:11px;color:var(--mu);letter-spacing:.08em;flex:1}
.apid{font:700 9px/1 'Courier New',monospace;color:var(--al);background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.30);padding:2px 7px;border-radius:2px;letter-spacing:.04em;white-space:nowrap}
.mbadge{font-size:9px;padding:1px 6px;border-radius:2px;letter-spacing:.06em;border:1px solid}
.mlive{color:var(--gr);border-color:#22c55e44;background:#22c55e11}
.mdemo{color:var(--mu);border-color:var(--bd)}
.examples{border-bottom:1px solid var(--bd);flex-shrink:0;overflow:hidden;transition:max-height .2s}
.exs-head{padding:5px 14px;display:flex;align-items:center;cursor:pointer;user-select:none;gap:6px;background:var(--sf)}
.exs-head:hover{background:#0f1824}
.exs-title{font-size:9px;color:var(--mu);letter-spacing:.06em;flex:1}
.exs-toggle{font-size:9px;color:var(--mu);transition:transform .2s}
.exs-grid{padding:5px 8px 7px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ex{background:var(--dm);border:1px solid var(--bd);border-radius:3px;padding:3px 7px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex:hover,.ex.on{border-color:var(--al);background:#17233a}
.etag{font-size:9px;letter-spacing:.05em;font-family:'Courier New',monospace}

/* Answer area */
.answer-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.answer{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint{font-size:11px;color:var(--mu);line-height:1.6;text-align:center;margin-top:16px}
.aq{font-size:10px;color:var(--a);font-style:italic;margin-bottom:3px;line-height:1.4;word-break:break-word}
.ab{background:var(--dm);border-left:2px solid var(--a);border-radius:0 4px 4px 0;padding:9px 11px;font-size:11px;color:var(--tx);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ab.fail{border-left-color:var(--re)}
.ab.pass{border-left-color:var(--gr)}
.ab.thinking{color:var(--mu);font-style:italic;border-left-color:var(--mu)}
.meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.mp{font-size:9px;padding:1px 5px;border-radius:2px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.hl-bar{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10px;color:var(--al)}
.hl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}

/* Violation summary pills (shown below answer for violation queries) */
.viol-summary{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.viol-pill{display:flex;align-items:center;gap:4px;font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid}
.viol-pill.CRITICAL{background:var(--sev-c-bg);color:var(--sev-c);border-color:var(--sev-c-bd)}
.viol-pill.HIGH    {background:var(--sev-h-bg);color:var(--sev-h);border-color:var(--sev-h-bd)}
.viol-pill.MEDIUM  {background:var(--sev-m-bg);color:var(--sev-m);border-color:var(--sev-m-bd)}

/* Selected node detail panel */
.detail-panel{flex-shrink:0;border-top:1px solid var(--bd);background:#080f1a;max-height:200px;overflow-y:auto;transition:max-height .2s}
.detail-panel.empty{max-height:0;overflow:hidden}
.dp-head{padding:6px 14px;display:flex;align-items:center;gap:8px;background:var(--dm);border-bottom:1px solid var(--bd)}
.dp-id{font-size:10px;color:var(--al);font-weight:bold}
.dp-lbl{font-size:9px;padding:1px 5px;border-radius:2px;margin-left:auto}
.dp-sev{font-size:9px;padding:1px 6px;border-radius:2px;font-weight:bold;letter-spacing:.04em}
.dp-sev.CRITICAL{background:var(--sev-c-bg);color:var(--sev-c);border:1px solid var(--sev-c-bd)}
.dp-sev.HIGH    {background:var(--sev-h-bg);color:var(--sev-h);border:1px solid var(--sev-h-bd)}
.dp-sev.MEDIUM  {background:var(--sev-m-bg);color:var(--sev-m);border:1px solid var(--sev-m-bd)}
.dp-close{font-size:11px;color:var(--mu);cursor:pointer;padding:0 4px;line-height:1}
.dp-close:hover{color:var(--tx)}
.dp-reason{padding:6px 14px;font-size:10px;color:var(--tx);border-bottom:1px solid var(--bd);line-height:1.5}
.dp-fields{padding:6px 14px 8px;display:flex;flex-direction:column;gap:3px}
.dp-row{display:flex;gap:8px;font-size:10px}
.dp-k{color:var(--mu);flex-shrink:0;width:110px}
.dp-v{color:#a5b4fc;word-break:break-all}
/* Explanation row in violation detail — wraps long text */
.dp-v.expl{color:#cbd5e1;font-style:italic;line-height:1.5}

/* Input */
.irow{padding:8px;border-top:1px solid var(--bd);display:flex;gap:6px;flex-shrink:0}
input[type=text]{flex:1;background:var(--dm);border:1px solid var(--bd);border-radius:4px;padding:7px 9px;font-size:10px;color:var(--tx);font-family:'Courier New',monospace;outline:none}
input[type=text]:focus{border-color:var(--a)}
input[type=text]::placeholder{color:var(--mu)}
button.run{background:var(--a);border:none;border-radius:4px;padding:7px 12px;font-size:10px;color:#000;cursor:pointer;font-weight:bold;transition:background .12s;flex-shrink:0}
button.run:hover{background:var(--al)}
button.run:disabled{background:var(--mu);cursor:default}
@keyframes pop{from{opacity:0;stroke-dashoffset:200}to{opacity:.92;stroke-dashoffset:0}}
.hbox{animation:pop .3s ease-out forwards}

/* ── HITL Review Panel ──────────────────────────────────────────────────────── */
.hitl-badge{display:inline-block;background:var(--re);color:#fff;font-size:8px;font-weight:bold;min-width:14px;height:14px;line-height:14px;text-align:center;border-radius:7px;padding:0 3px;margin-left:3px;vertical-align:middle}
.hitl-badge.hidden{display:none}
.hitl-btn{background:transparent;border:1px solid var(--bd);color:var(--mu);font-size:8px;padding:2px 7px;border-radius:2px;cursor:pointer;font-family:'Courier New',monospace;transition:color .12s,border-color .12s;letter-spacing:.06em;flex-shrink:0}
.hitl-btn:hover{border-color:var(--a);color:var(--a)}
.hitl-btn.active{border-color:var(--a);color:var(--a);background:rgba(217,119,6,.1)}
.chat-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.chat-wrap.hidden{display:none}
.hitl-wrap{display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.hitl-wrap.open{display:flex}
.hitl-stats{padding:6px 14px;border-bottom:1px solid var(--bd);font-size:9px;color:var(--mu);display:flex;align-items:center;gap:8px;flex-shrink:0}
.hitl-progress{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.hitl-progress-bar{height:100%;background:var(--gr);transition:width .3s;border-radius:2px}
.hitl-list{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px}
.hitl-card{background:var(--dm);border:1px solid var(--bd);border-radius:4px;cursor:pointer;transition:border-color .12s}
.hitl-card:hover{border-color:var(--mu)}
.hitl-card.focused{border-color:var(--a)}
.hitl-card.APPROVED{border-left:2px solid #22c55e;opacity:.7}
.hitl-card.REJECTED{border-left:2px solid #ef4444;opacity:.7}
.hitl-card.SKIPPED{opacity:.5}
.hc-head{padding:5px 7px;display:flex;align-items:center;gap:5px}
.hc-sev{font-size:8px;padding:1px 4px;border-radius:2px;font-weight:bold;letter-spacing:.04em;flex-shrink:0}
.hc-sev.CRITICAL{background:var(--sev-c-bg);color:var(--sev-c);border:1px solid var(--sev-c-bd)}
.hc-sev.HIGH    {background:var(--sev-h-bg);color:var(--sev-h);border:1px solid var(--sev-h-bd)}
.hc-sev.MEDIUM  {background:var(--sev-m-bg);color:var(--sev-m);border:1px solid var(--sev-m-bd)}
.hc-type{font-size:9px;color:var(--al);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Courier New',monospace;letter-spacing:.03em}
.hc-status{font-size:8px;padding:1px 4px;border-radius:2px;flex-shrink:0;letter-spacing:.04em}
.hc-status.PENDING {color:var(--mu);border:1px solid var(--bd)}
.hc-status.APPROVED{color:var(--gr);border:1px solid #22c55e44;background:#22c55e0d}
.hc-status.REJECTED{color:var(--re);border:1px solid #ef444444;background:#ef44440d}
.hc-status.SKIPPED {color:#64748b;border:1px solid #64748b44}
.hc-desc{padding:0 7px 4px;font-size:9px;color:#94a3b8;line-height:1.45;word-break:break-word}
.hc-node{padding:0 7px 3px;font-size:9px;color:var(--mu)}
.hc-node span{color:#a5b4fc;font-family:'Courier New',monospace}
.hc-actions{padding:3px 7px 5px;display:flex;gap:4px;align-items:center}
.hc-note{flex:1;background:#0a0d14;border:1px solid var(--bd);border-radius:2px;padding:2px 5px;font-size:9px;color:var(--tx);font-family:'Courier New',monospace;outline:none;min-width:0}
.hc-note:focus{border-color:var(--mu)}
.hc-act{font-size:8px;padding:2px 7px;border-radius:2px;border:1px solid;cursor:pointer;font-family:'Courier New',monospace;font-weight:bold;transition:all .12s;flex-shrink:0;letter-spacing:.04em}
.hc-act.approve{color:var(--gr);border-color:#22c55e44;background:#22c55e0d}
.hc-act.approve:hover:not(:disabled){background:#22c55e22}
.hc-act.reject {color:var(--re);border-color:#ef444444;background:#ef44440d}
.hc-act.reject:hover:not(:disabled){background:#ef444422}
.hc-act.skip   {color:var(--mu);border-color:var(--bd);background:transparent}
.hc-act.skip:hover:not(:disabled){border-color:var(--mu);color:var(--tx)}
.hc-act:disabled{opacity:.35;cursor:default}
.hitl-footer{padding:7px 10px;border-top:1px solid var(--bd);flex-shrink:0;display:flex;align-items:center;gap:8px}
.hitl-finalize{background:#22c55e0d;border:1px solid #22c55e44;color:var(--gr);font-size:9px;padding:5px 12px;border-radius:3px;cursor:pointer;font-family:'Courier New',monospace;font-weight:bold;transition:all .12s;letter-spacing:.06em}
.hitl-finalize:hover:not(:disabled){background:#22c55e22;border-color:#22c55e88}
.hitl-finalize:disabled{opacity:.35;cursor:default}
.hitl-status-msg{font-size:9px;color:var(--mu);flex:1;text-align:right}
</style>
</head>
<body>
<div class="root">
  <div class="viewer">
    <div class="vhead">
      <select class="pid-sel" id="pidSel"></select>
      <button id="reloadBtn" title="Reload node positions from GraphML"
        style="background:transparent;border:1px solid var(--mu);color:var(--mu);font-size:9px;padding:1px 6px;border-radius:2px;cursor:pointer;font-family:'Courier New',monospace;transition:color .12s,border-color .12s">↺</button>
      <span class="vtitle" id="vtitle">Loading...</span>
      <div class="cdot off" id="cdot"></div>
    </div>

    <div class="imgwrap" id="wrap">
      <div id="imgbox">
        <img id="img" class="pid-img loading" alt="P&ID"/>
        <svg id="svg" class="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="vfoot" id="leg"><span style="color:var(--mu)">Loading drawing...</span></div>
  </div>

  <div class="panel">
    <div class="phead">
      <span class="ptitle">KOS-PID AGENT</span>
      <span class="apid" id="apid">—</span>
      <span class="mbadge mdemo" id="mb">CONNECTING</span>
      <button class="hitl-btn" id="hitlBtn" title="Open HITL Review Queue">REVIEW<span class="hitl-badge hidden" id="hitlBadge">0</span></button>
    </div>
    <div class="examples" id="exs">
      <div class="exs-head" id="exsHead">
        <span class="exs-title">EXAMPLE QUERIES</span>
        <span class="exs-toggle" id="exsToggle">&#9650;</span>
      </div>
      <div class="exs-grid" id="exsGrid"></div>
    </div>
    <div id="chatWrap" class="chat-wrap">
    <div class="answer-wrap">
      <div class="answer" id="ans">
        <div class="hint">Select a PID above,<br>then ask a question or click an example.</div>
      </div>
      <div class="detail-panel empty" id="dp">
        <div class="dp-head">
          <span class="dp-id" id="dp-id"></span>
          <span class="dp-sev" id="dp-sev" style="display:none"></span>
          <span class="dp-lbl" id="dp-lbl"></span>
          <span class="dp-close" id="dp-close">✕</span>
        </div>
        <div class="dp-reason" id="dp-reason"></div>
        <div class="dp-fields" id="dp-fields"></div>
      </div>
    </div>
    <div class="irow">
      <input type="text" id="inp" placeholder="Ask anything about this P&ID..."/>
      <button class="run" id="run" disabled>RUN</button>
    </div>
    </div><!-- /chatWrap -->

    <div id="hitlWrap" class="hitl-wrap">
      <div class="hitl-stats">
        <span id="hitlStatText" style="flex-shrink:0">No PID selected</span>
        <div class="hitl-progress"><div class="hitl-progress-bar" id="hitlProgressBar" style="width:0%"></div></div>
        <span id="hitlStatPct" style="flex-shrink:0;min-width:30px;text-align:right">—</span>
      </div>
      <div class="hitl-list" id="hitlList">
        <div style="padding:24px;text-align:center;color:var(--mu);font-size:10px">Loading review queue…</div>
      </div>
      <div class="hitl-footer">
        <button class="hitl-finalize" id="hitlFinalizeBtn" disabled>Finalize Phase 7 →</button>
        <span id="hitlFinalizeStatus" class="hitl-status-msg"></span>
      </div>
    </div><!-- /hitlWrap -->

  </div>
</div>

<div id="tooltip">
  <div class="tt-id"   id="tt-id"></div>
  <div id="tt-sev-wrap"></div>
  <div class="tt-reason" id="tt-reason"></div>
  <div id="tt-fields"></div>
  <div class="tt-expl" id="tt-expl"></div>
</div>

<script>
// ── Colour palettes ───────────────────────────────────────────────────────────
const COLORS = {
  valve:'#f59e0b', tank:'#22d3ee', instrumentation:'#818cf8',
  'inlet/outlet':'#34d399', general:'#f472b6', arrow:'#a78bfa',
  connector:'#475569', crossing:'#64748b',
  inferred_check_valve:'#fb923c',   // distinct orange — inferred inline equipment
};

// Phase 3.5 severity colour map — overrides COLORS when a node has a violation
const SEVERITY_COLORS = {
  CRITICAL: '#ef4444',
  HIGH:     '#f59e0b',
  MEDIUM:   '#eab308',
};

// ── Sample queries ─────────────────────────────────────────────────────────────
// Indices 6–8 in the node array: functional_label, has_violations, violation_count
const SAMPLE_QS = [
  {q:'How many valves are there?',                     tag:'VALVE COUNT',  labels:['valve']},
  {q:'What external interfaces does this drawing have?',tag:'EXTERNAL',    labels:['inlet/outlet']},
  {q:'List all instrumentation',                       tag:'INSTRUMENTS',  labels:['instrumentation']},
  {q:'Show all tanks on this drawing',                 tag:'TANKS',        labels:['tank']},
  {q:'Show all equipment symbols',                     tag:'ALL SYMBOLS',
    labels:['valve','tank','instrumentation','inlet/outlet','general','arrow']},
  {q:'Is our drawing structurally consistent?',        tag:'QUALITY CHECK',labels:['general'],fail:true},
  // Phase 3.5 examples
  {q:'Are there any engineering rule violations?',     tag:'ENG VIOLATIONS',labels:[],fail:true,violation:true},
  {q:'Which pumps are missing a check valve?',         tag:'MISSING CHECK VALVE',labels:[],fail:true,violation:true},
];

// ── State ─────────────────────────────────────────────────────────────────────
// nodes array format: [id, label, xmin, ymin, w, h, functional_label, has_violations, violation_count]
let nodes=[], activePid='', pids=[], busy=false, isLive=false;
let nodeContext={by_id:{},by_label:{},query:''};
// severities: {node_id: 'CRITICAL'|'HIGH'|'MEDIUM'} — from highlight.severities
let activeSeverities={};
// explanations & rules: {node_id: 'text'} — from highlight for violation tooltips
let activeExplanations={};
let activeRules={};
let selectedId=null;

const svg     = document.getElementById('svg');
const leg     = document.getElementById('leg');
const ans     = document.getElementById('ans');
const img     = document.getElementById('img');
const pidSel  = document.getElementById('pidSel');
const tooltip = document.getElementById('tooltip');
const dp      = document.getElementById('dp');

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot(){
  try{
    const r=await fetch('/api/pids');
    const d=await r.json();
    pids=d.pids||[];
    if(!pids.length){setStatus('No PIDs in database','err');return;}
    pidSel.innerHTML=pids.map(p=>`<option value="${p}">${p}</option>`).join('');
    pidSel.addEventListener('change',()=>loadPid(pidSel.value));

    const reloadBtn=document.getElementById('reloadBtn');
    reloadBtn.addEventListener('click',async()=>{
      reloadBtn.textContent='...';
      try{
        await fetch('/api/cache/clear',{method:'POST'});
        await loadPid(activePid);
      }finally{reloadBtn.textContent='↺';}
    });
    reloadBtn.addEventListener('mouseenter',e=>{
      e.target.style.color='var(--al)';e.target.style.borderColor='var(--al)';
    });
    reloadBtn.addEventListener('mouseleave',e=>{
      e.target.style.color='var(--mu)';e.target.style.borderColor='var(--mu)';
    });

    isLive=true;
    document.getElementById('cdot').className='cdot live';
    document.getElementById('mb').textContent='LIVE';
    document.getElementById('mb').className='mbadge mlive';
    document.getElementById('run').disabled=false;
    await loadPid(d.active||pids[0]);
  }catch(e){setStatus('Cannot connect: '+e.message,'err');}
}

function setStatus(msg,cls){
  document.getElementById('vtitle').textContent=msg;
  document.getElementById('cdot').className='cdot '+(cls||'off');
}

// ── Load PID ──────────────────────────────────────────────────────────────────
async function loadPid(pid){
  activePid=pid; pidSel.value=pid;
  const apidEl=document.getElementById('apid');
  if(apidEl) apidEl.textContent=pid;
  try{
    await fetch('/api/pid',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pid_id:pid})});
  }catch(e){}

  img.classList.add('loading');
  img.src='/api/image/'+encodeURIComponent(pid)+'?t='+Date.now();
  img.onload=()=>img.classList.remove('loading');
  setStatus('Loading nodes for '+pid+'...');

  try{
    const r=await fetch('/api/nodes/'+encodeURIComponent(pid));
    const d=await r.json();
    if(d.error){setStatus('Node error: '+d.error,'err'); nodes=[]; return;}
    nodes=d.nodes||[];

    if(d.canvas){
      svg.setAttribute('viewBox',`0 0 ${d.canvas.w} ${d.canvas.h}`);
    }

    // Status bar: symbol counts (skip connectors/crossings/background)
    const counts={};
    nodes.forEach(n=>{counts[n[1]]=(counts[n[1]]||0)+1;});
    setStatus(
      Object.entries(counts)
        .filter(([l])=>!['connector','crossing'].includes(l))
        .map(([l,c])=>c+'×'+l).join('  ·  ')
    );

    clearOverlay(); clearDetail();
    ans.innerHTML='<div class="hint">Drawing loaded.<br>Ask a question or click an example below.<br>'
      +'<span style="color:var(--mu);font-size:10px">Hover over highlighted symbols for details.</span></div>';
    loadHitlQueue();
  }catch(e){setStatus('Node load failed','err'); nodes=[];}
}

// ── Overlay helpers ───────────────────────────────────────────────────────────
function clearOverlay(){
  svg.innerHTML='';
  activeSeverities={};
  activeExplanations={};
  activeRules={};
  leg.innerHTML='<span style="color:var(--mu)">No symbols highlighted</span>';
  nodeContext={by_id:{},by_label:{},query:''};
  selectedId=null;
}

// Resolve the stroke colour for a node in ID-mode.
// If the node has a severity (Phase 3.5 violation), use SEVERITY_COLORS.
// Otherwise fall back to node-type colour.
function _nodeColor(n, sevMap){
  const sev=sevMap&&sevMap[n[0]];
  if(sev&&SEVERITY_COLORS[sev]) return SEVERITY_COLORS[sev];
  // Index 7 = has_violations — if true and we have no explicit severity map entry,
  // treat as MEDIUM so violation nodes are always visually distinct.
  if(n[7]&&!sev) return SEVERITY_COLORS.MEDIUM;
  return COLORS[n[1]]||'#f59e0b';
}

function drawIds(ids, ctx, sevMap, contextIds, neighborMap){
  svg.innerHTML='';
  activeSeverities=sevMap||{};
  activeExplanations=ctx._explanations||{};
  activeRules=ctx._rules||{};
  const s=new Set(ids);
  const ctxSet=new Set(contextIds||[]);

  // Draw connection lines between violation nodes and their neighbors
  if(neighborMap && Object.keys(neighborMap).length){
    const nodeMap={};
    nodes.forEach(n=>{ nodeMap[n[0]]=n; });
    Object.entries(neighborMap).forEach(([src, nbrs])=>{
      const sn=nodeMap[src];
      if(!sn) return;
      const sx=sn[2]+sn[4]/2, sy=sn[3]+sn[5]/2;
      nbrs.forEach(dst=>{
        const dn=nodeMap[dst];
        if(!dn) return;
        const dx=dn[2]+dn[4]/2, dy=dn[3]+dn[5]/2;
        const line=document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',sx); line.setAttribute('y1',sy);
        line.setAttribute('x2',dx); line.setAttribute('y2',dy);
        const sev=sevMap[src]||'HIGH';
        const col=SEVERITY_COLORS[sev]||'#f59e0b';
        line.setAttribute('stroke',col);
        line.setAttribute('stroke-opacity','0.25');
        line.setAttribute('stroke-width','1.5');
        line.setAttribute('stroke-dasharray','6,4');
        svg.appendChild(line);
      });
    });
  }

  // Draw context nodes (neighbors) in dimmer style
  if(ctxSet.size){
    nodes.filter(n=>ctxSet.has(n[0])).forEach(n=>{
      const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('x',     n[2]-1.5);
      r.setAttribute('y',     n[3]-1.5);
      r.setAttribute('width', Math.max(n[4],7)+3);
      r.setAttribute('height',Math.max(n[5],7)+3);
      r.setAttribute('stroke','#4a6080');
      r.setAttribute('fill',  '#4a608018');
      r.setAttribute('rx','2');
      r.setAttribute('stroke-width','1.2');
      r.setAttribute('stroke-dasharray','4,3');
      r.setAttribute('data-id',  n[0]);
      r.setAttribute('data-lbl', n[1]);
      r.classList.add('hbox','context');
      r.addEventListener('mouseenter', e=>showTooltip(e,n,'#4a6080',ctx));
      r.addEventListener('mousemove',  e=>moveTooltip(e));
      r.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(r);
    });
  }

  // Draw primary violation nodes
  nodes.filter(n=>s.has(n[0])).forEach(n=>{
    mkRect(n, _nodeColor(n,sevMap), ctx);
  });
  const totalCtx=ctxSet.size;
  buildLeg(null, ids.length+(totalCtx?` + ${totalCtx} connected`:''), 'symbols', sevMap);
}

function drawLabels(labels, ctx){
  svg.innerHTML='';
  activeSeverities={};
  activeExplanations={};
  activeRules={};
  const multi=labels.length>1;
  nodes.filter(n=>labels.includes(n[1])).forEach(n=>{
    const c=multi?(COLORS[n[1]]||'#888'):(COLORS[labels[0]]||'#f59e0b');
    mkRect(n, c, ctx);
  });
  buildLeg(labels, nodes.filter(n=>labels.includes(n[1])).length, null, null);
}

function mkRect(n, c, ctx){
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',     n[2]-1.5);
  r.setAttribute('y',     n[3]-1.5);
  r.setAttribute('width', Math.max(n[4],7)+3);
  r.setAttribute('height',Math.max(n[5],7)+3);
  r.setAttribute('stroke',c);
  r.setAttribute('fill',  c+'28');
  r.setAttribute('rx','2');
  r.setAttribute('stroke-width','1.8');
  r.setAttribute('stroke-dasharray','180');
  r.setAttribute('data-id',  n[0]);
  r.setAttribute('data-lbl', n[1]);
  r.setAttribute('data-color',c);
  r.classList.add('hbox');
  r.addEventListener('mouseenter', e=>showTooltip(e,n,c,ctx));
  r.addEventListener('mousemove',  e=>moveTooltip(e));
  r.addEventListener('mouseleave', hideTooltip);
  r.addEventListener('click', e=>{e.stopPropagation(); selectNode(n,c,ctx);});
  svg.appendChild(r);
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
function getNodeInfo(n, ctx){
  const nid=n[0], lbl=n[1];
  if(ctx.by_id&&ctx.by_id[nid])    return ctx.by_id[nid];
  if(ctx.by_label&&ctx.by_label[lbl]) return {
    reason:ctx.by_label[lbl].reason, details:ctx.by_label[lbl].details||{}, severity:null
  };
  // Fallback: check if node has violations stamped from Neo4j (index 7)
  if(n[7]) return {reason:'Has '+n[8]+' engineering rule violation(s)', details:{}, severity:'MEDIUM'};
  return {reason:lbl+' symbol', details:{}, severity:null};
}

function showTooltip(e, n, c, ctx){
  const info=getNodeInfo(n,ctx);
  const nid=n[0];
  document.getElementById('tt-id').textContent=nid;
  document.getElementById('tt-id').style.color=c;

  // Severity badge (Phase 3.5 violations)
  const sev=info.severity||activeSeverities[nid]||null;
  const sevWrap=document.getElementById('tt-sev-wrap');
  sevWrap.innerHTML=sev
    ? `<div class="tt-sev ${sev}">${sev}</div>`
    : '';

  // Reason — use explanation from highlight data if available
  const explText=(ctx._explanations&&ctx._explanations[nid])||'';
  const ruleText=(ctx._rules&&ctx._rules[nid])||'';
  const reasonEl=document.getElementById('tt-reason');
  if(ruleText){
    reasonEl.textContent=ruleText;
  }else{
    reasonEl.textContent=info.reason||'';
  }

  // Functional label badge for small tanks identified as pumps
  const fn=n[6]; // functional_label (index 6)
  const fnBadge=fn&&fn!==n[1]
    ? `<span class="tt-key">Role:</span> <span style="color:#34d399">${fn}</span><br>`
    : '';

  const fields=document.getElementById('tt-fields');
  const detailHtml=Object.entries(info.details||{}).slice(0,6).map(([k,v])=>
    `<span class="tt-key">${k}:</span> <span style="color:#a5b4fc">${v}</span><br>`
  ).join('');
  fields.innerHTML=fnBadge+detailHtml;

  // Explanation panel — show the actual engineering reasoning
  const explEl=document.getElementById('tt-expl');
  if(explText){
    explEl.textContent=explText;
    explEl.style.display='block';
  }else{
    explEl.textContent='';
    explEl.style.display='none';
  }

  tooltip.classList.add('show');
  moveTooltip(e);
}

function moveTooltip(e){
  const x=e.clientX, y=e.clientY;
  const tw=tooltip.offsetWidth, th=tooltip.offsetHeight;
  const vw=window.innerWidth,   vh=window.innerHeight;
  tooltip.style.left=(x+tw+16>vw? x-tw-8 : x+12)+'px';
  tooltip.style.top= (y+th+8 >vh? y-th-8  : y+8)+'px';
}
function hideTooltip(){tooltip.classList.remove('show');}

// ── Detail panel ──────────────────────────────────────────────────────────────
function selectNode(n, c, ctx){
  document.querySelectorAll('.hbox').forEach(r=>{
    r.classList.toggle('selected', r.getAttribute('data-id')===n[0]);
  });
  selectedId=n[0];

  const info=getNodeInfo(n,ctx);
  document.getElementById('dp-id').textContent=n[0];
  document.getElementById('dp-id').style.color=c;

  // Severity badge
  const sev=info.severity||activeSeverities[n[0]]||null;
  const dpSev=document.getElementById('dp-sev');
  if(sev){
    dpSev.textContent=sev;
    dpSev.className='dp-sev '+sev;
    dpSev.style.display='inline-block';
  }else{
    dpSev.style.display='none';
  }

  const lbl=document.getElementById('dp-lbl');
  lbl.textContent=n[1];
  lbl.style.background=c+'22'; lbl.style.color=c; lbl.style.border=`1px solid ${c}44`;

  document.getElementById('dp-reason').textContent=info.reason||'';

  // Build detail rows — include functional_label and violation count when present
  const extraRows=[];
  if(n[6]&&n[6]!==n[1])
    extraRows.push(['Equipment role', n[6]]);
  if(n[7])
    extraRows.push(['Violations', String(n[8])]);

  const allEntries=[...Object.entries(info.details||{}), ...extraRows];
  const fields=document.getElementById('dp-fields');
  if(allEntries.length){
    fields.innerHTML=allEntries.map(([k,v])=>{
      const isExpl = k.toLowerCase()==='explanation';
      return `<div class="dp-row">
        <span class="dp-k">${k}</span>
        <span class="dp-v${isExpl?' expl':''}">${v}</span>
      </div>`;
    }).join('');
  }else{
    fields.innerHTML='<div style="font-size:10px;color:var(--mu)">No additional details</div>';
  }
  dp.classList.remove('empty');
}

function clearDetail(){
  dp.classList.add('empty');
  selectedId=null;
  document.querySelectorAll('.hbox').forEach(r=>r.classList.remove('selected'));
}

document.getElementById('dp-close').addEventListener('click', clearDetail);
svg.addEventListener('click', e=>{if(e.target===svg) clearDetail();});

// ── Apply highlight from server response ──────────────────────────────────────
function applyHighlight(h, ctx){
  nodeContext=ctx||{by_id:{},by_label:{},query:''};
  // Stash explanations and rules on context for tooltip access
  if(h && h.explanations) nodeContext._explanations=h.explanations;
  if(h && h.rules) nodeContext._rules=h.rules;
  if(!h) return;
  if(h.mode==='ids'&&h.node_ids.length)
    drawIds(h.node_ids, nodeContext, h.severities||{}, h.context_nodes||[], h.neighbors||{});
  else if(h.mode==='labels'&&h.labels.length)
    drawLabels(h.labels, nodeContext);
  else if(h.mode==='pipes'&&h.pipe_traces&&h.pipe_traces.length)
    drawPipes(h.pipe_traces, ctx, h.endpoint_nodes||[]);
  else
    clearOverlay();
}

// ── Pipe-trace rendering ──────────────────────────────────────────────────────
// Colour palette for the three flow states
// Keys are engineer-facing labels (SEEDED→Confirmed, PROPAGATED→Inferred, UNKNOWN→Undetermined)
const FLOW_COLORS={
  'Confirmed':    '#22d3ee',   // cyan   — flow direction marked by an arrow on the drawing
  'Inferred':     '#a78bfa',   // violet — flow direction traced from adjacent confirmed pipe
  'Undetermined': '#475569',   // slate  — flow direction not marked on this drawing
};
// Map raw Neo4j flow_state values to engineer-facing display labels
const FLOW_STATE_LABEL={
  'SEEDED':     'Confirmed',
  'PROPAGATED': 'Inferred',
  'UNKNOWN':    'Undetermined',
};
// Used for upstream/downstream/path endpoint boxes
const ENDPOINT_COLOR='#f59e0b';  // amber

function drawPipes(traces, ctx, endpointIds){
  svg.innerHTML='';
  activeSeverities={};
  activeExplanations={};
  activeRules={};

  // Build node centroid + full node map from the global nodes array
  const centroidMap={};
  const fullNodeMap={};
  nodes.forEach(n=>{
    centroidMap[n[0]]={x: n[2]+n[4]/2, y: n[3]+n[5]/2};
    fullNodeMap[n[0]]=n;
  });

  const stateCounts={'Confirmed':0,'Inferred':0,'Undetermined':0};
  const endpointSet=new Set(endpointIds||[]);

  // Build a set of all node IDs that appear in trace_nodes so we can
  // avoid boxing them twice when they also appear in endpointIds
  const traceNodeSet=new Set();
  traces.forEach(trace=>(trace.trace_nodes||[]).forEach(id=>traceNodeSet.add(id)));

  traces.forEach(trace=>{
    const pts=trace.trace_nodes||[];
    if(pts.length<2) return;
    const state=FLOW_STATE_LABEL[(trace.flow_state||'UNKNOWN').toUpperCase()]||'Undetermined';
    const color=FLOW_COLORS[state]||FLOW_COLORS['Undetermined'];
    stateCounts[state]=(stateCounts[state]||0)+1;
    const lpsId=trace.lps_id||'';
    const conf=trace.flow_confidence!=null?Math.round(trace.flow_confidence*100)+'%':'';

    // Resolve coordinates
    const coords=pts.map(id=>centroidMap[id]).filter(Boolean);
    if(coords.length<2) return;

    // Clickable transparent hit-zone so the polyline is hoverable
    const hit=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    hit.setAttribute('points', coords.map(p=>`${p.x},${p.y}`).join(' '));
    hit.setAttribute('stroke','transparent');
    hit.setAttribute('stroke-width','10');
    hit.setAttribute('fill','none');
    hit.style.cursor='pointer';
    hit.addEventListener('mouseenter', e=>{
      document.getElementById('tt-id').textContent='Pipe route';
      document.getElementById('tt-id').style.color=color;
      const dirLabel=trace.flow_direction==='FORWARD'?' → downstream':
                     trace.flow_direction==='REVERSE'?' ← upstream':'';
      const dirDisplay=trace.flow_direction==='FORWARD'?'Downstream →':
                       trace.flow_direction==='REVERSE'?'← Upstream':'';
      document.getElementById('tt-reason').textContent=
        state==='Undetermined'?'Flow direction not marked on this drawing':
        state==='Confirmed'?`Flow direction marked on drawing${dirLabel}`:
        `Flow direction traced from adjacent pipe${dirLabel}`;
      const fields=document.getElementById('tt-fields');
      fields.innerHTML=
        `<span class="tt-key">Flow:</span> <span style="color:${color}">${state}</span><br>`+
        (dirDisplay?`<span class="tt-key">Direction:</span> <span style="color:#a5b4fc">${dirDisplay}</span><br>`:'')+
        (conf?`<span class="tt-key">Confidence:</span> <span style="color:#a5b4fc">${conf}</span><br>`:'');
      document.getElementById('tt-expl').style.display='none';
      tooltip.classList.add('show');
      moveTooltip(e);
    });
    hit.addEventListener('mousemove',  e=>moveTooltip(e));
    hit.addEventListener('mouseleave', hideTooltip);
    svg.appendChild(hit);

    // Visible polyline
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('points', coords.map(p=>`${p.x},${p.y}`).join(' '));
    poly.setAttribute('stroke', color);
    poly.setAttribute('stroke-width', state==='Undetermined'?'1.2':'2.2');
    poly.setAttribute('stroke-opacity', state==='Undetermined'?'0.3':'0.8');
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke-linecap', 'round');
    poly.setAttribute('stroke-linejoin', 'round');
    poly.style.pointerEvents='none';
    if(state==='Undetermined') poly.setAttribute('stroke-dasharray','6,4');
    svg.appendChild(poly);

    // Direction arrowhead at midpoint for SEEDED/PROPAGATED
    if(state!=='Undetermined'&&coords.length>=2){
      const mid=Math.floor(coords.length/2);
      const p1=coords[mid-1], p2=coords[mid];
      const dx=p2.x-p1.x, dy=p2.y-p1.y;
      const len=Math.sqrt(dx*dx+dy*dy)||1;
      const ux=dx/len, uy=dy/len;
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      const hs=5;
      const arrow=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      const tip_x=mx+ux*hs*1.5, tip_y=my+uy*hs*1.5;
      const bl_x=mx-ux*hs+uy*hs, bl_y=my-uy*hs-ux*hs;
      const br_x=mx-ux*hs-uy*hs, br_y=my-uy*hs+ux*hs;
      arrow.setAttribute('points',`${tip_x},${tip_y} ${bl_x},${bl_y} ${br_x},${br_y}`);
      arrow.setAttribute('fill', color);
      arrow.setAttribute('fill-opacity','0.9');
      arrow.setAttribute('stroke','none');
      arrow.style.pointerEvents='none';
      svg.appendChild(arrow);
    }
  });

  // Draw endpoint boxes (source/destination nodes for path/connectivity queries)
  endpointSet.forEach(eid=>{
    const n=fullNodeMap[eid];
    if(!n) return;
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',     n[2]-2);
    r.setAttribute('y',     n[3]-2);
    r.setAttribute('width', Math.max(n[4],7)+4);
    r.setAttribute('height',Math.max(n[5],7)+4);
    r.setAttribute('stroke',ENDPOINT_COLOR);
    r.setAttribute('fill',  ENDPOINT_COLOR+'30');
    r.setAttribute('rx','2');
    r.setAttribute('stroke-width','2');
    r.setAttribute('data-id',  n[0]);
    r.setAttribute('data-lbl', n[1]);
    r.setAttribute('data-color',ENDPOINT_COLOR);
    r.classList.add('hbox');
    r.addEventListener('mouseenter', e=>showTooltip(e,n,ENDPOINT_COLOR,ctx));
    r.addEventListener('mousemove',  e=>moveTooltip(e));
    r.addEventListener('mouseleave', hideTooltip);
    r.addEventListener('click',      e=>{e.stopPropagation();selectNode(n,ENDPOINT_COLOR,ctx);});
    svg.appendChild(r);
  });

  // Legend
  const total=traces.length;
  const pills=Object.entries(stateCounts)
    .filter(([,c])=>c>0)
    .map(([s,c])=>`<span style="display:inline-flex;align-items:center;gap:4px">
      <span class="ldot" style="background:${FLOW_COLORS[s]}"></span>
      <b style="color:var(--tx)">${c}</b>&nbsp;
      <span style="color:${FLOW_COLORS[s]};font-size:9px">${s}</span>
    </span>`).join('');
  const epNote=endpointSet.size
    ? `<span style="display:inline-flex;align-items:center;gap:4px">
        <span class="ldot" style="background:${ENDPOINT_COLOR}"></span>
        <b style="color:var(--tx)">${endpointSet.size}</b>&nbsp;
        <span style="color:${ENDPOINT_COLOR};font-size:9px">endpoint${endpointSet.size>1?'s':''}</span>
      </span>` : '';
  leg.innerHTML=pills+epNote
    +`<span style="margin-left:auto;color:var(--mu)">${total} pipe line${total!==1?'s':''} — hover pipe or symbol for details</span>`;
}

// ── Legend builder ────────────────────────────────────────────────────────────
function buildLeg(labels, cnt, suffix, sevMap){
  if(sevMap&&Object.keys(sevMap).length){
    // Violation mode: show severity breakdown instead of label dots
    const sevCounts={CRITICAL:0,HIGH:0,MEDIUM:0};
    Object.values(sevMap).forEach(s=>{if(s) sevCounts[s]=(sevCounts[s]||0)+1;});
    const SEV_CSS={CRITICAL:'var(--sev-c)',HIGH:'var(--sev-h)',MEDIUM:'var(--sev-m)'};
    const pills=Object.entries(sevCounts)
      .filter(([,c])=>c>0)
      .map(([s,c])=>`<span style="display:inline-flex;align-items:center;gap:4px">
        <span class="ldot" style="background:${SEV_CSS[s]}"></span>
        <b style="color:var(--tx)">${c}</b>&nbsp;
        <span style="color:${SEV_CSS[s]};font-size:9px">${s}</span>
      </span>`).join('');
    leg.innerHTML=pills
      +`<span style="margin-left:auto;color:var(--mu)">${cnt} violations — hover or click</span>`;
    return;
  }
  if(labels){
    const dots=labels.map(l=>
      `<span style="display:inline-flex;align-items:center;gap:4px">
        <span class="ldot" style="background:${COLORS[l]||'#888'}"></span>
        <b style="color:var(--tx)">${nodes.filter(n=>n[1]===l).length}</b>&nbsp;
        <span style="color:var(--mu)">${l}</span>
      </span>`).join('');
    leg.innerHTML=dots
      +`<span style="margin-left:auto;color:var(--mu)">${cnt} highlighted</span>`
      +`<span style="color:var(--mu);font-size:9px;margin-left:8px">hover or click symbols</span>`;
  }else{
    leg.innerHTML=`<span style="color:var(--mu)">${cnt} ${suffix||'symbols'} highlighted — hover or click for details</span>`;
  }
}

// ── Answer display ────────────────────────────────────────────────────────────
function showThinking(q){
  ans.innerHTML=`<div class="aq">&#9656; ${q}</div><div class="ab thinking">Querying agent...</div>`;
}

function showAnswer(q, a, meta, hl, fail, ctx){
  const cls=fail?'fail':(a.startsWith('✅')||a.startsWith('PASS'))?'pass':'';

  // Highlight summary bar
  let hlBar='';
  if(hl){
    if(hl.mode==='ids'&&hl.node_ids&&hl.node_ids.length){
      const sevMap=hl.severities||{};
      if(Object.keys(sevMap).length){
        const sevCounts={CRITICAL:0,HIGH:0,MEDIUM:0};
        Object.values(sevMap).forEach(s=>{if(s)sevCounts[s]=(sevCounts[s]||0)+1;});
        const pills=Object.entries(sevCounts).filter(([,c])=>c>0)
          .map(([s,c])=>`<span class="viol-pill ${s}"><b>${c}</b> ${s}</span>`).join('');
        hlBar=`<div class="viol-summary">${pills}</div>`;
      }else{
        // Count only IDs that actually exist in the currently loaded drawing
        const idSet=new Set(hl.node_ids);
        const actualCnt=nodes.filter(n=>idSet.has(n[0])).length;
        if(actualCnt===0){
          hlBar=`<div class="hl-bar" style="color:var(--mu)">No symbols matched on this drawing</div>`;
        }else{
          hlBar=`<div class="hl-bar"><span class="hl-dot" style="background:var(--a)"></span><b>${actualCnt}</b> symbol${actualCnt!==1?'s':''} highlighted &#8212; hover on diagram</div>`;
        }
      }
    }else if(hl.mode==='labels'&&hl.labels&&hl.labels.length){
      const cnt=nodes.filter(n=>hl.labels.includes(n[1])).length;
      hlBar=`<div class="hl-bar"><span class="hl-dot" style="background:var(--a)"></span><b>${cnt}</b> symbol${cnt!==1?'s':''} highlighted — hover on diagram</div>`;
    }else if(hl.mode==='pipes'&&hl.pipe_traces&&hl.pipe_traces.length){
      const epSet=new Set(hl.endpoint_nodes||[]);
      const epCnt=nodes.filter(n=>epSet.has(n[0])).length;
      hlBar=`<div class="hl-bar"><span class="hl-dot" style="background:#22d3ee"></span><b>${hl.pipe_traces.length}</b> pipe line${hl.pipe_traces.length!==1?'s':''} traced${epCnt?`, <b>${epCnt}</b> endpoint${epCnt!==1?'s':''} highlighted`:''} &#8212; hover on diagram</div>`;
    }else{
      hlBar=`<div class="hl-bar" style="color:var(--mu)">No symbols matched on this drawing</div>`;
    }
  }

  // Compact meta pills (intent + strategy only)
  const mHtml=meta
    ?`<div class="meta">${meta.map(m=>`<span class="mp">${m}</span>`).join('')}</div>`:'';

  ans.innerHTML=`<div class="aq">&#9656; ${q}</div><div class="ab ${cls}">${a}</div>${hlBar}${mHtml}`;
}

// ── Live query ────────────────────────────────────────────────────────────────
async function runQuery(q){
  if(busy||!isLive) return;
  busy=true;
  document.getElementById('run').disabled=true;
  showThinking(q); clearOverlay(); clearDetail();
  try{
    const r=await fetch('/api/query',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q, pid_id:activePid}),
      signal:AbortSignal.timeout(30000),
    });
    const d=await r.json();
    if(d.error){
      showAnswer(q,'Error: '+d.error,[],null,true,{});
    }else{
      const meta=[`intent: ${d.intent}`,`strategy: ${d.strategy}`];
      const hl=d.highlight;
      const ctx=d.node_context||{};
      showAnswer(q, d.answer, meta, hl, d.answer.toLowerCase().includes('fail'), ctx);
      applyHighlight(hl, ctx);
    }
  }catch(e){
    showAnswer(q,
      e.name==='TimeoutError'?'Request timed out.':'Error: '+e.message,
      [],null,true,{});
    document.getElementById('cdot').className='cdot err';
  }finally{
    busy=false;
    document.getElementById('run').disabled=false;
  }
}

// ── Example buttons ───────────────────────────────────────────────────────────
const exsGrid=document.getElementById('exsGrid');
const exsHead=document.getElementById('exsHead');
const exsToggle=document.getElementById('exsToggle');
const exsPanel=document.getElementById('exs');
let exsOpen=true;

exsHead.addEventListener('click',()=>{
  exsOpen=!exsOpen;
  exsGrid.style.display=exsOpen?'grid':'none';
  exsToggle.style.transform=exsOpen?'':'rotate(180deg)';
});

SAMPLE_QS.forEach((q,i)=>{
  const btn=document.createElement('button');
  btn.className='ex';
  const c=q.violation?'#ef4444':q.fail?'#ef4444':(COLORS[q.labels[0]]||'#888');
  btn.innerHTML=`<span class="etag" style="color:${c}">${q.tag}</span>`;
  btn.title=q.q;
  btn.onclick=()=>{
    document.querySelectorAll('.ex').forEach((b,j)=>b.classList.toggle('on',j===i));
    runQuery(q.q);
  };
  exsGrid.appendChild(btn);
});

document.getElementById('run').onclick=()=>{
  const v=document.getElementById('inp').value.trim();
  if(!v||busy) return;
  document.querySelectorAll('.ex').forEach(b=>b.classList.remove('on'));
  runQuery(v);
  document.getElementById('inp').value='';
};
document.getElementById('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('run').click();
});

// ── HITL Review ───────────────────────────────────────────────────────────────
let hitlMode=false, hitlItems=[], hitlLocalStatus={};
const hitlWrap=document.getElementById('hitlWrap');
const chatWrap=document.getElementById('chatWrap');

async function loadHitlQueue(){
  if(!activePid) return;
  try{
    const r=await fetch('/api/hitl/queue/'+encodeURIComponent(activePid));
    const d=await r.json();
    if(d.error){console.warn('[HITL]',d.error);return;}
    hitlItems=d.items||[];
    hitlLocalStatus={};  // reset local overrides on fresh load
    const pending=hitlItems.filter(i=>i.hitl_status==='PENDING').length;
    const badge=document.getElementById('hitlBadge');
    if(pending>0){badge.textContent=String(pending);badge.classList.remove('hidden');}
    else{badge.classList.add('hidden');}
    if(hitlMode) renderHitlQueue();
  }catch(e){console.warn('[HITL] load failed:',e);}
}

function renderHitlQueue(){
  const list=document.getElementById('hitlList');
  const statEl=document.getElementById('hitlStatText');
  const progBar=document.getElementById('hitlProgressBar');
  const pctEl=document.getElementById('hitlStatPct');
  const finalizeBtn=document.getElementById('hitlFinalizeBtn');
  const finalizeStatus=document.getElementById('hitlFinalizeStatus');

  if(!hitlItems.length){
    list.innerHTML='<div style="padding:24px;text-align:center;color:var(--mu);font-size:10px;line-height:1.7">No items in the review queue for this PID.<br>'
      +'<span style="font-size:9px">All annotations may already be reviewed,<br>or no high-severity patterns were found.</span></div>';
    statEl.textContent='Queue empty'; if(pctEl) pctEl.textContent='—';
    progBar.style.width='100%'; progBar.style.background='var(--gr)';
    finalizeBtn.disabled=false;
    if(finalizeStatus) finalizeStatus.textContent='Ready to finalize';
    return;
  }

  const total=hitlItems.length;
  const reviewed=hitlItems.filter(i=>(hitlLocalStatus[i.ann_id]||i.hitl_status)!=='PENDING').length;
  const pending=total-reviewed;
  const pct=total>0?Math.round(reviewed/total*100):0;
  statEl.textContent=`${reviewed} / ${total} reviewed`;
  if(pctEl) pctEl.textContent=pct+'%';
  progBar.style.width=pct+'%';
  progBar.style.background=pending===0?'var(--gr)':'var(--a)';
  finalizeBtn.disabled=pending>0;
  if(finalizeStatus) finalizeStatus.textContent=pending>0?pending+' item'+(pending!==1?'s':'')+' pending':'Ready to finalize';

  list.innerHTML=hitlItems.map((item,idx)=>{
    const localSt=hitlLocalStatus[item.ann_id];
    const displaySt=localSt||item.hitl_status||'PENDING';
    const isDone=displaySt!=='PENDING';
    const srcTag=item.source==='phase3_engineering_rules'?'ENG':'RARITY';
    const dis=isDone?' disabled':'';
    return `<div class="hitl-card${isDone?' '+displaySt:''}" id="hcard_${idx}" onclick="focusHitlItem(${idx})">
  <div class="hc-head">
    <span class="hc-sev ${item.severity}">${item.severity}</span>
    <span class="hc-type">${item.pattern_type||'—'}</span>
    <span style="font-size:8px;padding:1px 4px;border-radius:2px;color:var(--mu);border:1px solid var(--bd);flex-shrink:0">${srcTag}</span>
    <span class="hc-status ${displaySt}">${displaySt}</span>
  </div>
  <div class="hc-desc">${item.description||''}</div>
  ${item.node_id?`<div class="hc-node">Node: <span>${item.node_id}</span></div>`:''}
  <div class="hc-actions">
    <input class="hc-note" type="text" placeholder="Note / reason…" id="hnote_${idx}"${dis?dis:''} onclick="event.stopPropagation()">
    <button class="hc-act approve" onclick="event.stopPropagation();hitlAct('${item.ann_id}','approve',${idx})"${dis}>✓ OK</button>
    <button class="hc-act reject"  onclick="event.stopPropagation();hitlAct('${item.ann_id}','reject',${idx})"${dis}>✗ NO</button>
    <button class="hc-act skip"    onclick="event.stopPropagation();hitlAct('${item.ann_id}','skip',${idx})"${dis}>→ SKIP</button>
  </div>
</div>`;
  }).join('');
}

function focusHitlItem(idx){
  const item=hitlItems[idx];
  if(!item) return;
  document.querySelectorAll('.hitl-card').forEach((c,i)=>c.classList.toggle('focused',i===idx));
  if(item.node_id){
    const sevMap={[item.node_id]:item.severity};
    const hitlCtx={
      by_id:{[item.node_id]:{
        reason:item.pattern_type,
        details:{
          Source:item.source.replace('phase3_','').replace('_',' '),
          Severity:item.severity,
          Status:item.hitl_status||'PENDING',
        },
        severity:item.severity,
      }},
      by_label:{},query:'',
      _explanations:{[item.node_id]:item.description},
      _rules:{},
    };
    drawIds([item.node_id],hitlCtx,sevMap,[],{});
  }
}

async function hitlAct(ann_id,action,idx){
  const noteEl=document.getElementById('hnote_'+idx);
  const note=(noteEl?noteEl.value:'')||'';
  try{
    const r=await fetch('/api/hitl/decision',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ann_id,action,reviewer:'ui_reviewer',note}),
    });
    const d=await r.json();
    if(d.error){alert('Error: '+d.error);return;}
    const newSt=action==='approve'?'APPROVED':action==='reject'?'REJECTED':'SKIPPED';
    hitlLocalStatus[ann_id]=newSt;
    if(hitlItems[idx]) hitlItems[idx].hitl_status=newSt;
    renderHitlQueue();
    const pending=hitlItems.filter(i=>(hitlLocalStatus[i.ann_id]||i.hitl_status)==='PENDING').length;
    const badge=document.getElementById('hitlBadge');
    if(pending>0){badge.textContent=String(pending);badge.classList.remove('hidden');}
    else{badge.classList.add('hidden');}
  }catch(e){alert('Request failed: '+e.message);}
}

async function finalizePhase7(){
  const btn=document.getElementById('hitlFinalizeBtn');
  const statusEl=document.getElementById('hitlFinalizeStatus');
  btn.disabled=true;
  if(statusEl) statusEl.textContent='Running Phase 7 finalization…';
  try{
    const r=await fetch('/api/hitl/finalize/'+encodeURIComponent(activePid),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
    });
    const d=await r.json();
    if(d.error){
      if(statusEl) statusEl.textContent='Error: '+d.error;
      btn.disabled=false;
      return;
    }
    if(statusEl) statusEl.textContent='';
    btn.textContent='PHASE7_COMPLETE ✓';
    btn.classList.add('active');
    btn.style.background='#22c55e22';
    btn.style.borderColor='#22c55e66';
    btn.style.color='var(--gr)';
  }catch(e){
    if(statusEl) statusEl.textContent='Error: '+e.message;
    btn.disabled=false;
  }
}

function openHitlPanel(){
  hitlMode=true;
  hitlWrap.classList.add('open');
  chatWrap.classList.add('hidden');
  exsPanel.style.display='none';
  document.getElementById('hitlBtn').classList.add('active');
  renderHitlQueue();  // show cached items immediately
  loadHitlQueue();    // refresh from DB
}

function closeHitlPanel(){
  hitlMode=false;
  hitlWrap.classList.remove('open');
  chatWrap.classList.remove('hidden');
  exsPanel.style.display='';
  document.getElementById('hitlBtn').classList.remove('active');
  clearOverlay();
}

document.getElementById('hitlBtn').addEventListener('click',()=>{
  if(hitlMode) closeHitlPanel(); else openHitlPanel();
});
document.getElementById('hitlFinalizeBtn').addEventListener('click', finalizePhase7);

boot();
</script>
